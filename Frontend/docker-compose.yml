version: "3.8"

services:
  siaman-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://apisiaman.danipinion.my.id/api
    container_name: siaman_frontend_prod
    ports:
      - "3001:80" # Akses frontend di host port 3000
    restart: unless-stopped
    networks:
      - siaman_net

networks:
  siaman_net:
    driver: bridge
