server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html HARUS selalu fresh agar deploy baru langsung terlihat
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA fallback untuk semua route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite menghasilkan nama file dengan hash (index-CMFz20Ns.js) → aman di-cache lama
    location ~* \.(js|css|woff2?|eot|ttf|otf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Gambar dan media — cache sedang
    location ~* \.(ico|gif|jpe?g|png|webp|webmanifest|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
