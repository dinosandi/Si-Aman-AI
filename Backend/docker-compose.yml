services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: siaman-postgis
    environment:
      - POSTGRES_DB=SiAman
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=11223344
    ports:
      - "5433:5432"
    volumes:
      - siaman_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siaman-api
    # Port tidak di-expose ke host — hanya diakses oleh nginx di dalam jaringan Docker
    expose:
      - "5105"
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=SiAman;Username=postgres;Password=11223344
    restart: unless-stopped
    networks:
      - siaman_net

  # Nginx proxy: Cloudflare Tunnel → port 5105 → nginx → API / Nextcloud
  proxy:
    image: nginx:alpine
    container_name: siaman-proxy
    ports:
      - "5105:80"  # Cloudflare Tunnel tetap arahkan ke port 5105
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - siaman_net
    extra_hosts:
      - "host.docker.internal:host-gateway"  # akses ke 10.0.0.50 lewat host jika perlu

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: siaman-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

networks:
  siaman_net:
    driver: bridge

volumes:
  siaman_postgres_data:
  pgadmin_data:
